name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / MSVC / Qt 6.10
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 说明：aqtinstall 3.3.0 尚不支持 Qt 6.11 的新仓库布局（qt6_6111_*），
          # 因此 CI 固定 Qt 6.10.3；本机开发使用 Qt 6.11.1，源码保持 Qt 6.5+ 兼容。
          # 待 aqtinstall 支持 6.11 后统一升级（见 docs/02-设计文档.md §11.3）。
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Smoke test (native windows platform)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "build\SnapOCR.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "SnapOCR --smoke-test failed with exit code $($proc.ExitCode)"
          }

      # 发布工程：windeployqt 绿色包 + zip；只在 main 分支推送时产出 artifact
      - name: Package (windeployqt + zip)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+(\S+)').Matches[0].Groups[1].Value
          $pkg = "dist/SnapOCR-$version"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "build/SnapOCR.exe" "$pkg/SnapOCR.exe"
          Copy-Item "README.md" "$pkg/README.md"
          & windeployqt --release --no-opengl-sw --no-system-d3d-compiler --no-quick-import --compiler-runtime --translations zh_CN "$pkg/SnapOCR.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          # 我们自己的界面翻译（snapocr_*.qm）也要打进发布包，否则英文 UI 不生效
          if (Test-Path "build/translations") {
            New-Item -ItemType Directory -Force -Path "$pkg/translations" | Out-Null
            Copy-Item "build/translations/*.qm" "$pkg/translations/" -Force
          }
          tar -a -c -f "dist/SnapOCR-$version-win64.zip" -C dist "SnapOCR-$version"
          Write-Host "packaged: dist/SnapOCR-$version-win64.zip"
          (Get-Item "dist/SnapOCR-$version-win64.zip").Length

      - name: Upload package artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SnapOCR-win64-package
          path: dist/SnapOCR-*-win64.zip
          retention-days: 14
