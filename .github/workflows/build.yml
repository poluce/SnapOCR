name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / MSVC / Qt 6.10
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # 说明：aqtinstall 3.3.0 尚不支持 Qt 6.11 的新仓库布局（qt6_6111_*），
          # 因此 CI 固定 Qt 6.10.3；本机开发使用 Qt 6.11.1，源码保持 Qt 6.5+ 兼容。
          # 待 aqtinstall 支持 6.11 后统一升级（见 docs/02-technical-design.md §11.3）。
          version: '6.10.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Smoke test (native windows platform)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "build\SnapOCR.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "SnapOCR --smoke-test failed with exit code $($proc.ExitCode)"
          }
